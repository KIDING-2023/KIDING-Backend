server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com:
      amazons:
        util:
          EC2MetadataUtils: error
    org.hibernate.SQL: DEBUG       # SQL 쿼리 로그 활성화
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # SQL 실행 파라미터 로그

spring:

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #AWS:Kiding2
    url: jdbc:mysql://kiding2.cjmcuiii67x9.ap-northeast-2.rds.amazonaws.com:3306/Kiding2
    username: admin
    password: 

#    #Local
#    url: jdbc:mysql://localhost:3306/kidinglocal?createDatabaseIfNotExist=true
#    username: root
#    password: 

  jwt:
    secret: 
    access-token-expiration-minutes: 60

  # 전화번호 인증용
  sms:
    api-key: 
    api-secret: 
    provider: https://api.coolsms.co.kr
    sender: 

  jpa:
    properties:
      hibernate:
        ddl-auto: create #create update none
        globally_quoted_identifiers: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      show-sql: true
